[tool.poetry]
name = "ast-diff-poc"
version = "0.1.0"
description = "AST-based diff POC for Property files"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "ast_diff_poc", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
mypy = "^1.5.0"
click = "^8.1.0"

[tool.poetry.scripts]
ast-diff = "ast_diff_poc.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
