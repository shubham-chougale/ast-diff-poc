APP_VERSION=2.5.0
BUILD_NUMBER=1847
ENVIRONMENT=production
DEBUG_MODE=false
LOG_LEVEL=INFO
MAX_CONNECTIONS=100
POOL_SIZE=20
RETRY_ATTEMPTS=3

module.core.enabled=true
module.reporting.enabled=true
module.analytics.enabled=false
module.workflow.enabled=true
module.notifications.enabled=true
module.integration.enabled=false
module.audit.enabled=true

db.connection.timeout=30000
db.query.timeout=60000
db.pool.min=5
db.pool.max=50
db.validation.interval=30000

cache.provider=redis
cache.ttl.default=3600
cache.ttl.session=1800
cache.ttl.static=86400
cache.compression=true

auth.provider=oauth2
auth.token.expiry=3600
auth.refresh.expiry=604800
auth.mfa.enabled=false
auth.password.minLength=8
auth.password.requireSpecial=true
auth.password.requireNumbers=true
auth.session.concurrent=3
auth.lockout.attempts=5
auth.lockout.duration=900

security.cors.enabled=true
security.cors.origins=https://app.example.com
security.csrf.enabled=true
security.headers.xss=true
security.headers.contentType=true
security.headers.frameOptions=DENY
security.encryption.algorithm=AES-256
security.encryption.keyRotation=90

email.provider=smtp
email.host=smtp.example.com
email.port=587
email.secure=true
email.from.address=noreply@example.com
email.from.name=Application Notifications
email.template.path=/templates/email
email.retry.attempts=3
email.retry.delay=1000

storage.provider=s3
storage.bucket=app-uploads
storage.region=us-east-1
storage.maxSize=104857600
storage.allowedTypes=pdf,doc,docx,xls,xlsx,png,jpg,jpeg
storage.encryption=true
storage.versioning=false

queue.provider=rabbitmq
queue.host=queue.example.com
queue.port=5672
queue.prefetch=10
queue.retry.attempts=5
queue.retry.delay=5000
queue.deadLetter.enabled=true

scheduler.enabled=true
scheduler.timezone=UTC
scheduler.job.cleanup=0 0 2 * * ?
scheduler.job.report=0 0 6 * * ?
scheduler.job.backup=0 0 0 * * ?
scheduler.job.sync=0 */15 * * * ?

api.version=v2
api.basePath=/api
api.rateLimit.enabled=true
api.rateLimit.requests=1000
api.rateLimit.window=3600
api.pagination.default=20
api.pagination.max=100
api.timeout=30000
api.compression=true

webhook.enabled=true
webhook.secret=webhook_secret_key
webhook.timeout=10000
webhook.retry.attempts=3
webhook.events.create=true
webhook.events.update=true
webhook.events.delete=true

monitoring.enabled=true
monitoring.provider=prometheus
monitoring.endpoint=/metrics
monitoring.interval=15000
monitoring.alerts.enabled=true
monitoring.alerts.email=ops@example.com

logging.format=json
logging.output=stdout
logging.file.enabled=true
logging.file.path=/var/log/app
logging.file.maxSize=100MB
logging.file.maxFiles=10
logging.file.compress=true
logging.audit.enabled=true
logging.audit.retention=365

feature.darkMode=true
feature.notifications=true
feature.chat=false
feature.videoCall=false
feature.fileSharing=true
feature.collaboration=true
feature.analytics=false
feature.aiAssistant=false
feature.customBranding=true

ui.theme.default=light
ui.language.default=en
ui.dateFormat=MM/DD/YYYY
ui.timeFormat=12h
ui.timezone.autoDetect=true
ui.pagination.options=10,25,50,100
ui.table.stickyHeader=true
ui.table.resizable=true
ui.form.autoSave=false
ui.form.autoSaveInterval=30000

integration.salesforce.enabled=false
integration.salesforce.clientId=
integration.salesforce.clientSecret=
integration.slack.enabled=true
integration.slack.webhook=https://hooks.slack.com/services/xxx
integration.jira.enabled=false
integration.jira.baseUrl=
integration.jira.apiToken=

report.engine=jasper
report.output.path=/reports
report.temp.path=/tmp/reports
report.logo.path=/assets/logo.png
report.footer.text=Confidential - Internal Use Only
report.watermark.enabled=false
report.async.threshold=10000

backup.enabled=true
backup.schedule=daily
backup.retention=30
backup.compression=gzip
backup.encryption=true
backup.destination=s3://backups
backup.notification.enabled=true
backup.notification.email=admin@example.com

compliance.gdpr.enabled=true
compliance.gdpr.dataRetention=730
compliance.gdpr.anonymization=true
compliance.hipaa.enabled=false
compliance.sox.enabled=true
compliance.sox.auditTrail=true
compliance.pci.enabled=false

performance.cache.queries=true
performance.cache.views=true
performance.lazy.loading=true
performance.minify.css=true
performance.minify.js=true
performance.cdn.enabled=false
performance.cdn.url=

maintenance.mode=false
maintenance.message=System is under maintenance
maintenance.allowedIps=192.168.1.1,192.168.1.2
maintenance.estimatedEnd=

